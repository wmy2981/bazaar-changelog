name: CI

# 每次推送到 main / dev、以及所有 PR 都跑一遍：类型检查、测试（带覆盖率门槛）、构建。
# 发版仍由 cd.yml 负责，两者互不依赖。
on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # lockfile 里的 resolved 指向 npmmirror；GitHub runner 上镜像偶发 500 会卡住安装，
      # 这里把地址换成官方 registry 再装（版本与 integrity 不变）。
      - name: Use the official registry
        run: sed -i 's#https://registry.npmmirror.com#https://registry.npmjs.org#g' package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 覆盖率门槛写在 vitest.config.ts 里，掉下去会直接失败
      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build
